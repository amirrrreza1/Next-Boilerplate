name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. We MUST use Node 22 because pnpm v11 requires the node:sqlite module
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2. We explicitly request pnpm v11 to match your local machine's lockfile
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      # 3. Install dependencies strictly using the lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Run the native ESLint CLI directly (bypassing next lint)
      - name: Run Linter
        run: pnpm run lint

      # 5. Run the Vitest testing suite
      - name: Run Tests
        run: pnpm run test:run
